name: Configure Custom Domain

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure GitHub Pages is enabled
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Attach limestudio.dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh api
          --method PUT
          "repos/${GITHUB_REPOSITORY}/pages"
          -f cname=limestudio.dev
          -f build_type=workflow
